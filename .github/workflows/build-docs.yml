name: Build Agentforce PDFs

# Edit assets/documents/source/*.md on GitHub; this rebuilds the PDFs and
# commits them back. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "assets/documents/source/**"
      - "scripts/build-docs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-core libpango-1.0-0 libpangoft2-1.0-0
          pip install markdown weasyprint
      - name: Build PDFs
        run: python scripts/build-docs.py
      - name: Commit PDFs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/documents/rag/*.pdf assets/documents/agentforce-topic-instructions.pdf
          git diff --cached --quiet || git commit -m "Rebuild Agentforce PDFs from Markdown sources"
          git push
